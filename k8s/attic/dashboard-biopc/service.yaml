apiVersion: v1
kind: Service
metadata:
  name: dashboard-biopc
spec:
  type: LoadBalancer
  # Distinct external ports so both dashboard LB services can coexist under a
  # single `minikube tunnel` (http://localhost:8080 here, :8081 for dti). On a
  # cloud cluster each Service gets its own external IP, so you may use 80 there.
  ports:
  - port: 8080
    targetPort: 80
  selector:
    app: dashboard-biopc
