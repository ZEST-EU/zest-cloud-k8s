apiVersion: v1
kind: Service
metadata:
  name: dashboard-dti
spec:
  type: LoadBalancer
  # Distinct external ports so both dashboard LB services can coexist under a
  # single `minikube tunnel` (http://localhost:8081 here, :8080 for biopc). On a
  # cloud cluster each Service gets its own external IP, so you may use 80 there.
  ports:
  - port: 8081
    targetPort: 80
  selector:
    app: dashboard-dti
